name: Terraform Apply - GCP

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    name: Create Terraform Plan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: gcp-cloud-platform/environments/dev

    outputs:
      plan_artifact: terraform-plan

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SA }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Create saved plan
        env:
          TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
          TF_VAR_bucket_name: loadbalancer-bucket
          TF_VAR_db_password: ${{ secrets.TF_VAR_db_password }}
          TF_VAR_alert_email: ${{ secrets.TF_VAR_alert_email }}
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Upload saved plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: gcp-cloud-platform/environments/dev/tfplan
          retention-days: 1

  apply:
    name: Apply Approved Plan
    needs: plan
    runs-on: ubuntu-latest
    environment: terraform-apply

    defaults:
      run:
        working-directory: gcp-cloud-platform/environments/dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SA }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Download saved plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: gcp-cloud-platform/environments/dev

      - name: Apply approved plan
        run: terraform apply -input=false -auto-approve tfplan